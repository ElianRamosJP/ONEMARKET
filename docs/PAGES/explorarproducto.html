<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorar Productos | ONEMARKET</title>

    <link rel="stylesheet" href="../STYLES/estiloep.css">
</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">
            ONEMARKET
        </div>

        <!-- BUSCADOR -->
        <input 
            type="text" 
            placeholder="Buscar productos..."
            class="search"
        >

        <!-- ACCIONES -->
        <div class="nav-actions">

            <!-- CARRITO -->
            <div class="cart-container">

                <span 
                    class="cart"
                    onclick="window.location.href='../PAGES/carrito.html'"
                >
                    🛒
                </span>

                <span class="contador-carrito">
                    0
                </span>

            </div>

            <!-- PERFIL -->
            <button 
                class="Perfil"
                onclick="window.location.href='../PAGES/perfil.html'"
            >
                👤
            </button>

        </div>

    </header>

    <!-- TITULO -->
    <section class="Explorar">

        <div class="Explorar-header">

            <h2>
                Explorar Productos
            </h2>

            <p>
                Encuentra exactamente lo que buscas
            </p>

        </div>

    </section>

    <!-- FILTROS -->
    <section class="filters">

        <span class="label">
            Filtros:
        </span>

        <button class="filter-btn active" data-category="all">
            Todos
        </button>

        <button class="filter-btn" data-category="men's clothing">
            Hombre
        </button>

        <button class="filter-btn" data-category="women's clothing">
            Mujer
        </button>

        <button class="filter-btn" data-category="electronics">
            Electrónica
        </button>

        <button class="filter-btn" data-category="jewelery">
            Joyas
        </button>

    </section>

    <!-- PRODUCTOS -->
    <section class="products">

        <!-- GRID DINAMICO -->
        <div class="grid"></div>

    </section>

       <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-container">

            <!-- LEFT -->
            <div class="footer-left">

                <h2 class="footer-logo">
                    ONEMARKET
                </h2>

                <p>
                    Tu tienda online de confianza.
                </p>

            </div>

            <!-- LINKS -->
            <div class="footer-links">

                <div>

                    <h4>Comprar</h4>

                    <a href="PAGES/explorarproducto.html">
                        Todos los Productos
                    </a>

                    <a href="PAGES/carrito.html">
                        Carrito
                    </a>

                </div>

                <div>

                    <h4>Mi Cuenta</h4>

                    <a href="PAGES/perfil.html">
                        Perfil
                    </a>

                    <a href="PAGES/login.html">
                        Iniciar sesión
                    </a>

                    <a href="PAGES/mispedidos.html">
                        Mis pedidos
                    </a>

                </div>

            </div>

            <!-- SOCIAL -->
            <div class="footer-social">

                <h4>Síguenos</h4>

                <div class="icons">

                    <span>📷</span>
                    <span>💼</span>
                    <span>❌</span>

                </div>

            </div>

        </div>

    </footer>


    <!-- SCRIPT -->
    <script src="../SCRIPTS/explorarproducto.js"></script>

</body>
</html>
