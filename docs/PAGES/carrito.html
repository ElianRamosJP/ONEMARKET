<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Carrito</title>

    <link rel="stylesheet"
    href="../STYLES/estiloco.css">

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo">

            <img
            src="../IMAGE/one market.png"
            alt="Logo">

            ONEMARKET

        </div>

        <div class="nav-actions">

            <button
            class="perfil"
            onclick="window.location.href='../PAGES/perfil.html'">

                👤

            </button>

        </div>

    </header>

    <!-- CARRITO -->
    <section class="carrito-container">

        <h1>
            Tu Carrito
        </h1>

        <!-- PRODUCTOS -->
        <div class="carrito-productos"></div>

        <!-- TOTAL -->
        <div class="carrito-total">

            <h2>

                Total:
                <span class="total">
                    $0
                </span>

            </h2>

            <button
              class="explorar_productos"
              onclick="finalizarCompra()">

               Finalizar Compra

            </button>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-container">

            <!-- IZQUIERDA -->
            <div class="footer-left">

                <h2 class="footer-logo">
                    ONEMARKET
                </h2>

                <p>
                    Tu tienda online de confianza.
                </p>

            </div>

            <!-- LINKS -->
            <div class="footer-link">

                <div>

                    <h4>
                        Comprar
                    </h4>

                    <a href="../PAGES/explorarproducto.html">
                        Todos los Productos
                    </a>

                    <br>

                    <a href="../PAGES/carrito.html">
                        Carrito
                    </a>

                </div>

                <div>

                    <h4>
                        Mi Cuenta
                    </h4>

                    <a href="../PAGES/perfil.html">
                        Perfil
                    </a>

                    <br>

                    <a href="../PAGES/login.html">
                        Iniciar sesión
                    </a>

                    <br>

                    <a href="../PAGES/mispedidos.html">
                        Mis pedidos
                    </a>

                </div>

            </div>

            <!-- DERECHA -->
            <div class="footer-social">

                <h4>
                    Síguenos
                </h4>

                <div class="icons">

                    <span>📷</span>
                    <span>💼</span>
                    <span>❌</span>

                </div>

            </div>

        </div>

    </footer>

    <!-- JS -->
    <script src="../SCRIPTS/carrito.js"></script>

</body>

</html>
