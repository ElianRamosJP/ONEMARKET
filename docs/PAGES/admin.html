<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Panel Admin | ONEMARKET</title>

    <link rel="stylesheet"
    href="../STYLES/admin.css">

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div class="logo"
        onclick="window.location.href='../index.html'">

            ONEMARKET

        </div>

        <div class="nav-right">

            <span id="adminName">
                Admin
            </span>

            <button
            class="logout"
            onclick="cerrarSesion()">

                Cerrar sesión

            </button>

        </div>

    </header>

    <!-- CONTENIDO -->
    <main class="container">

        <!-- USUARIOS -->
        <section class="section">

            <div class="section-header">

                <div>

                    <h2>
                        Gestión de Usuarios
                    </h2>

                    <p class="sub">
                        Administra usuarios registrados
                    </p>

                </div>

            </div>

            <div class="card">

                <div class="tabla">

                    <div class="fila header">

                        <span>Usuario</span>
                        <span>Email</span>
                        <span>Ciudad</span>
                        <span>Estado</span>
                        <span>Acciones</span>

                    </div>

                    <div id="tablaUsuarios"></div>

                </div>

            </div>

            <!-- STATS -->
            <div class="stats">

                <div class="box">

                    <p>Total Usuarios</p>

                    <b id="totalUsuarios">
                        0
                    </b>

                </div>

                <div class="box verde">

                    <p>Usuarios Activos</p>

                    <b id="usuariosActivos">
                        0
                    </b>

                </div>

            </div>

        </section>

        <!-- PRODUCTOS -->
        <section class="section">

            <div class="section-header">

                <div>

                    <h2>
                        Gestión de Productos
                    </h2>

                    <p class="sub">
                        Productos conectados desde FakeStore API
                    </p>

                </div>

            </div>

            <div class="card">

                <div class="tabla">

                    <div class="fila header">

                        <span>Producto</span>
                        <span>Categoría</span>
                        <span>Precio</span>
                        <span>Stock</span>
                        <span>Acciones</span>

                    </div>

                    <div id="tablaProductos"></div>

                </div>

            </div>

            <!-- STATS -->
            <div class="stats">

                <div class="box">

                    <p>Total Productos</p>

                    <b id="totalProductos">
                        0
                    </b>

                </div>

                <div class="box verde">

                    <p>Inventario</p>

                    <b id="inventario">
                        $0
                    </b>

                </div>

            </div>

        </section>

    </main>

    <!-- JS -->
    <script src="../SCRIPTS/admin.js"></script>

</body>

</html>
