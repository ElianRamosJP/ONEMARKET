<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login | ONEMARKET</title>

    <link rel="stylesheet"
    href="../STYLES/estilolg.css">

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div
        class="logo"
        onclick="window.location.href='../index.html'">

            ONEMARKET

        </div>

    </header>

    <!-- LOGIN -->
    <section class="login">

        <div class="login-header">

            <img
            src="../IMAGE/one market.png"
            alt="Logo">

            <h2>
                Bienvenido a ONEMARKET
            </h2>

            <p>
                Inicia sesión para continuar
            </p>

        </div>

        <!-- FORM -->
        <form
        class="login-box"
        id="loginForm">

            <h3>
                Iniciar Sesión
            </h3>

            <p class="sub">

                Ingresa tus credenciales

            </p>

            <!-- USUARIO -->
            <label>
                Usuario
            </label>

            <input
            type="text"
            id="usuario"
            required>

            <!-- PASSWORD -->
            <label>
                Contraseña
            </label>

            <input
            type="password"
            id="password"
            required>

            <!-- BOTON -->
            <button type="submit">

                Iniciar Sesión

            </button>

            <!-- REGISTRO -->
            <p class="registro">

                ¿No tienes cuenta?

                <a href="../PAGES/crearcuenta.html">

                    Crea una aquí

                </a>

            </p>

        </form>

    </section>

    <!-- JS -->
    <script src="../SCRIPTS/login.js"></script>

</body>

</html>
