<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta 
        name="viewport" 
        content="width=device-width, initial-scale=1.0"
    >

    <title>Detalles del Producto</title>

    <link 
        rel="stylesheet" 
        href="../STYLES/estilodp.css"
    >

</head>

<body>

    <!-- NAVBAR -->

    <header class="navbar">

        <div 
            class="logo"
            onclick="window.location.href='../index.html'"
        >
            ONEMARKET
        </div>

        <input 
            type="text"
            placeholder="Buscar Productos..."
            class="search"
        >

        <div class="nav-actions">

            <div class="cart-container">

                <span 
                    class="cart"
                    onclick="window.location.href='../PAGES/carrito.html'"
                >
                    🛒
                </span>

                <span class="contador-carrito">
                    0
                </span>

            </div>

            <button 
                class="Perfil"
                onclick="window.location.href='../PAGES/perfil.html'"
            >
                👤
            </button>

        </div>

    </header>

    <!-- PRODUCTO -->

    <section class="producto">

        <div class="producto-contenedor">

            <!-- IMAGEN -->

            <div class="producto-img">

                <img 
                    id="producto-imagen"
                    src=""
                    alt=""
                >

            </div>

            <!-- INFO -->

            <div class="producto-info">

                <span class="categoria" id="categoria">
                    Categoría
                </span>

                <h2 id="titulo">
                    Producto
                </h2>

                <div class="rating">
                    ⭐⭐⭐⭐⭐
                </div>

                <p class="precio" id="precio">
                    $0
                </p>

                <div class="descripcion">

                    <h4>
                        Descripción
                    </h4>

                    <p id="descripcion">

                    </p>

                </div>

                <button class="btn-carrito">

                    Agregar al carrito

                </button>

            </div>

        </div>

        <hr>

    </section>

    <!-- RELACIONADOS -->

    <section class="relacionados">

        <h3>
            Artículos parecidos
        </h3>

        <div class="relacionados-contenedor">

        </div>

    </section>

    <!-- SCRIPT -->

    <script src="../SCRIPTS/detallesdelproducto.js"></script>
   

</body>

</html>
