<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Perfil | ONEMARKET
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="../STYLES/estilopl.css">

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div
        class="logo"
        onclick="window.location.href='../index.html'">

            ONEMARKET

        </div>

    </header>

    <!-- PERFIL -->
    <section class="perfil">

        <div class="perfil-box">

            <h3>
                Perfil
            </h3>

            <!-- HEADER -->
            <div class="perfil-header">

                <div class="avatar">

                    👤

                </div>

                <div class="info">

                    <h2 id="nombreUsuario">

                        USER

                    </h2>

                    <p id="fecha">

                        Miembro de ONEMARKET

                    </p>

                </div>

            </div>

            <hr>

            <!-- DATOS -->
            <div class="datos">

                <p id="email"></p>

                <p id="telefono"></p>

                <p id="direccion"></p>

                <p id="rol"></p>

            </div>

            <!-- BOTON ADMIN -->
            <button
            id="adminBtn"
            class="btn-secundario"
            style="display:none"
            onclick="window.location.href='../PAGES/admin.html'">

                Panel Administrador

            </button>

            <!-- BOTON LOGOUT -->
            <button
            class="btn-logout"
            onclick="cerrarSesion()">

                Cerrar sesión

            </button>

            <!-- BOTONES -->
            <button
            class="btn-secundario"
            onclick="window.location.href='../PAGES/carrito.html'">

                Mi carrito

            </button>

            <button
            class="btn-secundario"
            onclick="window.location.href='../PAGES/mispedidos.html'">

                Mis pedidos

            </button>

        </div>

    </section>

    <!-- JS -->
    <script src="../SCRIPTS/perfil.js"></script>

</body>

</html>
