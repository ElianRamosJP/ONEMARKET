<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>
        Mis Pedidos | ONEMARKET
    </title>

    <!-- CSS -->
    <link rel="stylesheet"
    href="../STYLES/estilomp.css">

</head>

<body>

    <!-- NAVBAR -->
    <header class="navbar">

        <div
        class="logo"
        onclick="window.location.href='../index.html'">

            ONEMARKET

        </div>

    </header>

    <!-- HISTORIAL -->
    <section class="historial">

        <h2>
            Historial de Compras
        </h2>

        <!-- FILTRO -->
        <div class="filtro-box">

            <p class="titulo">

                Filtrar por fechas

            </p>

            <div class="filtro-grid">

                <div>

                    <label>
                        Fecha Inicio
                    </label>

                    <input
                    type="date"
                    id="fechaInicio">

                </div>

                <div>

                    <label>
                        Fecha Fin
                    </label>

                    <input
                    type="date"
                    id="fechaFin">

                </div>

            </div>

            <button
            class="btn-filtrar"
            onclick="filtrarPedidos()">

                Filtrar

            </button>

        </div>

        <!-- TEXTO -->
        <p class="sub">

            Tus últimas compras realizadas

        </p>

        <!-- PEDIDOS -->
        <div
        id="contenedorPedidos">

        </div>

    </section>

    <!-- JS -->
    <script src="../SCRIPTS/mispedidos.js"></script>

</body>

</html>
